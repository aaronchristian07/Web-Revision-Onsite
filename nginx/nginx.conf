events{}

http{
    # docker's embedded DNS - lets us resolve upstreams at request time instead
    # of at startup, so nginx survives a backend container restart
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format routed '$remote_addr "$request" status=$status upstream=$upstream_addr';
    access_log /var/log/nginx/access.log routed;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ice-cream image uploads
    client_max_body_size 10m;

    server{
        listen 80;

        # gateway liveness - this is what the container healthcheck hits
        location = /healthz {
            access_log off;
            return 200 'gateway up\n';
            add_header Content-Type text/plain;
        }

        # /api/auth/login -> auth-services:8001/auth/login
        location /api/auth {
            set $auth_upstream auth-services:8001;
            rewrite ^/api(/auth.*)$ $1 break;
            proxy_pass http://$auth_upstream;
        }

        # /api/ice-cream/:id -> ice-service:8002/ice-cream/:id
        location /api/ice-cream {
            set $ice_upstream ice-service:8002;
            rewrite ^/api(/ice-cream.*)$ $1 break;
            proxy_pass http://$ice_upstream;
        }

        location /payment {
            set $payment_upstream payment-service:8003;
            proxy_pass http://$payment_upstream$request_uri;
            proxy_set_header Host $host;
        }

        # everything else is the frontend - keep this block last
        location / {
            set $frontend_upstream frontend:5173;
            proxy_pass http://$frontend_upstream;

            # proxy_set_header does NOT merge across levels: declaring any
            # header here drops every one inherited from http{}. So the
            # http-block set has to be repeated, or Host defaults to
            # $proxy_host ("frontend") and vite blocks it as an unknown host.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # vite HMR websocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
