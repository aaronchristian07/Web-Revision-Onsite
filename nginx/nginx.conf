events{}

http{
    resolver 127.0.0.11 valid=10s;

    log_format routed '$remote_addr "$request" status=$status upstream=$upstream_addr';
    access_log /var/log/nginx/access.log routed;

    server{
        listen 80;

        location / {
            return 200 'gateway up\n';
            add_header Content-Type text/plain;
        }

        location /api/auth{
            set $auth_upstream auth-services:8001;
            proxy_pass http://$auth_upstream$request_uri;
            proxy_set_header Host $host;
        }

        location /ice-cream {
            set $ice_upstream ice-service:8002;
            proxy_pass http://$ice_upstream$request_uri;
            proxy_set_header Host $host;
        }

    }
}